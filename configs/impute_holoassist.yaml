# Pseudo-labeling for HoloAssist. Runs under venv_labeling and shells out to venv_tapip3d;
# see checkpoints.md for why the three environments cannot be unified.
#
# label_root is generated by scripts/prepare_holoassist_labels.py from the official released
# annotation file, rather than the preprocessed labels_*_classes.json that earlier runs used
# and that no longer exists anywhere.
holoassist_root: /data01/aneeshg5/holoassist
label_root: /data01/aneeshg5/holoassist_labels
out_dir: /data01/aneeshg5/pseudo_labels_v2
work_dir: /data01/aneeshg5/pseudo_labels_v2/work

n: 64
event_key: fine_grained_action
device: cuda

# intermediates run ~475MB per clip and are regenerable; at this corpus size keeping them
# would need terabytes, and it is what filled /data01 during the Stage 1 retrain
keep_intermediates: false

sam2_checkpoint: /home/aneeshg5/seg_experiment/sam2/checkpoints/sam2_hiera_base_plus.pt
sam2_model_cfg: sam2_hiera_b+.yaml

tapip3d_python: /home/aneeshg5/foretrack4d/venv_tapip3d/bin/python
tapip3d_repo: /home/aneeshg5/foretrack4d/third_party/tapip3d
tapip3d_checkpoint: /home/aneeshg5/foretrack4d/third_party/tapip3d/checkpoints/tapip3d_final.pth

# gates left at labeling/filter.py's calibrated defaults (jerk 0.084663, depth var 0.031315,
# min visible 0.15) -- those were tuned against lab GT, so overriding them here would silently
# move the accept rate
filter: {}
